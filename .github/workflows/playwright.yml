name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual re-run from the Actions tab.
  workflow_dispatch:
  # Nightly run: both systems under test are live third-party sandboxes, so
  # they can drift even when this repo doesn't change.
  schedule:
    - cron: '0 3 * * *'

# A newer push to the same branch cancels the in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No .env file in CI, so these come from repository secrets instead.
env:
  API_USERNAME: ${{ secrets.API_USERNAME }}
  API_PASSWORD: ${{ secrets.API_PASSWORD }}
  UI_ADMIN_USERNAME: ${{ secrets.UI_ADMIN_USERNAME }}
  UI_ADMIN_PASSWORD: ${{ secrets.UI_ADMIN_PASSWORD }}

jobs:
  smoke:
    name: Smoke (must-pass gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck

      - run: npx playwright install --with-deps chromium

      - run: npm run test:smoke

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-playwright-report
          path: playwright-report/
          retention-days: 7

  regression:
    name: Full regression suite
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - run: npm run test:regression

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: regression-playwright-report
          path: playwright-report/
          retention-days: 7
